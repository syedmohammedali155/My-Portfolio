<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Syed Muhammad Ali | Creative Graphic Designer & Social Media Specialist</title>
    <meta name="description" content="Portfolio of Syed Muhammad Ali - Creative Graphic Designer, Social Media Creative Specialist, and Co-Founder of TECK HEAVEN." />
    
    <!-- Single Page Apps for GitHub Pages redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window))
    </script>

    <!-- Open Graph / Meta -->
    <meta property="og:title" content="Syed Muhammad Ali | Creative Graphic Designer & Social Media Specialist" />
    <meta property="og:description" content="Explore high-converting social media creatives for Instagram & Facebook, brand identities, and corporate awards by Syed Muhammad Ali." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
